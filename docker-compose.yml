version: "3.8"
services:
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9081:9081"
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_DB: zalando
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: